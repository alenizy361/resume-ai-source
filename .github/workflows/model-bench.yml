name: Model bench

# Which model should this product run on? Answered by running the product's own
# drafting prompt against every candidate and reading what comes back, rather
# than by trusting a leaderboard that never saw an Arabic job title.
#
# Needs the NVIDIA_API_KEY repository secret (and ANTHROPIC_API_KEY to include
# Claude in the comparison). Each model costs 3 calls.
#
# Two suites, because there are two versions of the question:
#
#   models  WHICH model. Three hard cases against every candidate — cheap, and the way to
#           choose. 3 calls per model.
#   titles  How good the CHOSEN model is across the whole catalogue: all 111 occupations the
#           product publishes a page for, scored with the product's own honesty helpers.
#           1 call per title.
#
# They live in one workflow because a workflow_dispatch workflow is only dispatchable when its
# file is on the DEFAULT branch, and this one already is. A second file would sit undispatchable
# on a feature branch until it merged — and the two suites are the same question anyway.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "models = pick a model (3 calls each) · titles = score the chosen model across all 111 occupations (1 call each)"
        type: choice
        options: ["models", "titles"]
        default: "models"
      lang:
        description: "titles suite only — which half of the catalogue"
        type: choice
        options: ["both", "ar", "en"]
        default: "both"
      limit:
        description: "titles suite only — sample this many titles, spread across categories. 0 = all."
        type: string
        default: "0"
      retries:
        description: "titles suite only — re-send a HUNG request this many times. 0 reproduces the original single-attempt measurement."
        type: string
        default: "2"
      provider:
        description: "titles suite only — which provider drafts. Same prompt and same scoring either way; anthropic needs ANTHROPIC_API_KEY."
        type: choice
        options: ["nvidia", "anthropic"]
        default: "nvidia"
      models:
        description: "Comma-separated model ids. Empty = every chat model in the NVIDIA catalogue."
        type: string
        default: ""
      list_only:
        description: "Only print the catalogue, spend nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    # 111 calls at four in flight. Generous, so a slow provider does not cost the whole run's
    # results — which are the only output that matters.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm the key reached the runner
        env:
          NV: ${{ secrets.NVIDIA_API_KEY }}
          AN: ${{ secrets.ANTHROPIC_API_KEY }}
          WANT: ${{ inputs.provider }}
          # A key put in the wrong store or under a near-miss name reads to the
          # owner as "it's there" and to the runner as absent. Naming the exact
          # variants tells us which mistake it was instead of guessing.
          NV_ALT1: ${{ secrets.NVIDIA_KEY }}
          NV_ALT2: ${{ secrets.NVIDIA_API }}
          NV_ALT3: ${{ secrets.NVIDIA }}
          NV_ALT4: ${{ secrets.NVIDIA_APIKEY }}
          NV_VAR: ${{ vars.NVIDIA_API_KEY }}
          AN_ALT1: ${{ secrets.ANTHROPIC_KEY }}
          AN_ALT2: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          # Lengths only — never a value. GitHub also masks any secret it knows.
          echo "── Actions repository secrets ──"
          echo "NVIDIA_API_KEY    : ${#NV} chars"
          echo "ANTHROPIC_API_KEY : ${#AN} chars"
          echo "── near-miss names, in case it was typed differently ──"
          echo "NVIDIA_KEY        : ${#NV_ALT1}"
          echo "NVIDIA_API        : ${#NV_ALT2}"
          echo "NVIDIA            : ${#NV_ALT3}"
          echo "NVIDIA_APIKEY     : ${#NV_ALT4}"
          echo "ANTHROPIC_KEY     : ${#AN_ALT1}"
          echo "CLAUDE_API_KEY    : ${#AN_ALT2}"
          echo "── Variables tab (not Secrets) ──"
          echo "vars.NVIDIA_API_KEY: ${#NV_VAR}"
          # The titles suite needs the key for the provider it was asked to test; naming which
          # one is missing beats "no key reached the runner" when only one of two is set.
          if [ "${{ inputs.suite }}" = "titles" ] && [ "$WANT" = "anthropic" ] && [ -z "$AN" ]; then
            echo "::error::provider=anthropic but ANTHROPIC_API_KEY is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          [ -n "$NV" ] || [ -n "$AN" ] || {
            echo "::error::No key reached the runner. If a length above is non-zero, the key exists under that name — tell me which and I will use it. If every length is 0, the key is in a store Actions cannot read (Codespaces or Dependabot secrets), or in another repo."
            exit 1
          }

      - name: Bench the models
        if: inputs.suite == 'models'
        working-directory: src
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELS: ${{ inputs.models }}
        run: |
          node --experimental-strip-types ops/model-bench.mjs \
            ${{ inputs.list_only && '--list' || '' }}

      - name: Bench every title
        if: inputs.suite == 'titles'
        working-directory: src
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Empty means the product's own default, which is the model to measure.
          AI_MODEL: ${{ inputs.models }}
          OUT: ${{ github.workspace }}/titles-bench.md
        run: |
          node --experimental-strip-types ops/titles-bench.mjs \
            --provider=${{ inputs.provider }} \
            --lang=${{ inputs.lang }} --limit=${{ inputs.limit }} \
            --retries=${{ inputs.retries }} --concurrency=4

      - name: Put the titles report in the job summary
        if: always() && inputs.suite == 'titles'
        run: |
          # The summary is where this gets read: the log carries the per-title lines, this
          # carries the pass rates, the latencies and every title with a finding.
          if [ -f "${{ github.workspace }}/titles-bench.md" ]; then
            cat "${{ github.workspace }}/titles-bench.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The bench produced no report — see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && inputs.suite == 'titles'
        with:
          name: titles-bench
          path: titles-bench.md
          if-no-files-found: warn
