name: Worst-case cost

# What one resume costs when the user is as unhelpful as a real user gets:
# rambling, off-topic, contradicting themselves, answering a different question,
# and taking the full question budget to say what a good user says in three turns.
# The point is the ceiling, not the average — you price for the ceiling.
#
# Reads nothing from the response body except what it needs; the actual token
# counts come from the [usage] lines the routes now log, read from Vercel after.
#
# Two halves, separately switchable, because each spends real credit:
#   builder   — every paid call one CV can make: a blueprint, a job-advert delta,
#               one package per job, and the final content pass
#   optimize  — the rewrite, one call at the maximum input the route accepts
#
# The first half used to drive the 12-turn conversation. The chat is retired and
# its route is deleted, so the ceiling is now measured where the money actually
# goes: /api/generate. A user with five jobs and a pasted advert is the realistic
# worst case, and it is eight calls, not fourteen.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Where to test"
        type: string
        default: "https://cv.rabit.sa"
      run_builder:
        description: "Drive every paid call one CV can make (~8 model calls)"
        type: boolean
        default: true
      run_optimize:
        description: "Measure the rewrite at maximum input (1 model call)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - name: Drive one maximally expensive CV
        if: ${{ inputs.run_builder }}
        env:
          BASE: ${{ inputs.base_url }}
        run: |
          # Five jobs is the ceiling a CV realistically reaches, and each one buys
          # its own experience_package — that is the term that scales, so it is the
          # term worth measuring. The blueprint is bought once and read by every
          # stage; jd_delta is bought only when an advert is pasted.
          CTX='{"occupation":"Senior Accountant","specialization":"month-end close","seniority":"senior","country":"Saudi Arabia","cvLang":"ar"}'
          calls=0
          spent=0

          run () {  # run <label> <json body>
            sleep 3   # the route's own burst limit is not what we are measuring
            code=$(curl -sS -o out.json -w '%{http_code}' --max-time 120 \
              -X POST "$BASE/api/generate" \
              -H "Content-Type: application/json" --data "$2" || echo 000)
            calls=$((calls+1))
            usd=$(jq -r '._meta.estimatedUsd // 0' out.json 2>/dev/null || echo 0)
            model=$(jq -r '._meta.model // "-"' out.json 2>/dev/null || echo -)
            in_t=$(jq -r '._meta.inputTokens // 0' out.json 2>/dev/null || echo 0)
            out_t=$(jq -r '._meta.outputTokens // 0' out.json 2>/dev/null || echo 0)
            cached=$(jq -r 'if ._meta.cachedPrefix then "cached" else "cold" end' out.json 2>/dev/null || echo ?)
            spent=$(python3 -c "print(round($spent + $usd, 6))")
            printf '%-28s HTTP %s  %-20s %6s→%-6s %-6s $%s\n' "$1" "$code" "$model" "$in_t" "$out_t" "$cached" "$usd"
          }

          run "role_blueprint" "$(jq -nc --argjson c "$CTX" '{task:"role_blueprint",context:$c,confirmedSkills:[]}')"

          # A pasted advert, at the length the route accepts. This is the call a
          # user buys by pasting a link, and it is bought at most once.
          jd=$(python3 -c "print('المطلوب إعداد القوائم المالية الشهرية وإدارة الأستاذ العام ومطابقة الحسابات البنكية والإشراف على الذمم. المتطلبات: خبرة في ساب أو أوراكل، عضوية سوكبا مفضلة. ' * 12)")
          run "jd_delta" "$(jq -nc --argjson c "$CTX" --arg jd "$jd" '{task:"jd_delta",context:$c,jobAd:$jd,baseline:[]}')"

          for i in 1 2 3 4 5; do
            run "experience_package $i" "$(jq -nc --argjson c "$CTX" --argjson n "$i" \
              '{task:"experience_package",context:$c,
                experience:{title:"محاسب أول",department:"المالية",industry:"تجزئة",
                            userBullets:["أعددت الإقفال الشهري لفروع الشركة"],current:($n==1)},
                themes:[]}')"
          done

          facts=$(python3 -c "print('الخبرة العملية\n' + '\n'.join('- ' + 'أعددت الإقفال الشهري ومطابقة الحسابات' for _ in range(30)))")
          run "final_content" "$(jq -nc --argjson c "$CTX" --arg f "$facts" '{task:"final_content",context:$c,facts:$f,sections:[]}')"

          echo "════════════════════════════════════════════════"
          echo "paid calls for one CV at the ceiling: $calls"
          echo "the route's own cost estimate:        \$$spent"
          echo
          echo "The [usage] lines in Vercel are the authority; this is what the"
          echo "route itself believed it spent, printed per call above."

      - name: Measure the rewrite at the maximum input the route accepts
        if: ${{ inputs.run_optimize }}
        env:
          BASE: ${{ inputs.base_url }}
        run: |
          # The rewrite is the single most expensive call in the product, and it
          # is the one the conversation never reaches in a metered run. Its
          # ceiling is not "a long resume" — it is the route's own limits:
          # 8000 chars of resume and 4000 of job description, against a 6000
          # max_tokens rewrite. Anything a real user does costs less than this.
          python3 - <<'PY' > body.json
          import json
          role = ("Senior Accountant — Al Rajhi Trading Company, Riyadh | 2018 - 2024\n"
                  "- Managed month-end close across 15 branches and reconciled 40M SAR in annual revenue\n"
                  "- Led the migration from manual ledgers to SAP FICO, cutting close time by 30%\n"
                  "- Supervised a team of 6 junior accountants and reviewed all VAT filings\n"
                  "- Built the cash-flow forecasting model used by the CFO for quarterly planning\n")
          head = ("Abdulaziz Alanazi\nRiyadh, Saudi Arabia | someone@example.com | +966500000000\n\n"
                  "SUMMARY\nAccounting professional with broad experience across retail and trading.\n\n"
                  "SKILLS\nSAP FICO, Oracle Financials, Excel modelling, IFRS, VAT, ZATCA e-invoicing\n\n"
                  "EXPERIENCE\n")
          resume = head
          n = 0
          while len(resume) + len(role) <= 8000:
              resume += role.replace("2018 - 2024", f"{2018-n*6} - {2024-n*6}"); n += 1
          jd_unit = ("Responsibilities: prepare monthly financial statements, manage the general "
                     "ledger, reconcile bank accounts, oversee accounts payable and receivable, "
                     "ensure IFRS compliance, support external audits, and maintain ZATCA "
                     "e-invoicing readiness. Requirements: SAP or Oracle ERP, advanced Excel, "
                     "SOCPA membership preferred, 5+ years in a similar role. ")
          jd = ""
          while len(jd) + len(jd_unit) <= 4000:
              jd += jd_unit
          print(json.dumps({"resume": resume, "jobDescription": jd,
                            "uiLang": "ar", "outLang": "both"}))
          PY

          echo "resume chars:  $(jq -r '.resume | length' body.json)  (route cap 8000)"
          echo "jd chars:      $(jq -r '.jobDescription | length' body.json)  (route cap 4000)"
          echo "outLang: both — the most expensive setting, it writes the CV twice"
          echo

          code=$(curl -sS -o out.ndjson -w '%{http_code}' --max-time 300 \
            -X POST "$BASE/api/optimize" \
            -H "Content-Type: application/json" --data @body.json || echo 000)
          echo "HTTP $code   response bytes: $(wc -c < out.ndjson)"
          # NDJSON: the last line carries the result. Print its shape, not its text.
          tail -n 1 out.ndjson | jq '{score, afterScore,
              summaryChars: (.d.matchSummary // "" | length),
              resumeChars:  (.d.optimizedResume // "" | length)} // .' 2>/dev/null \
            || tail -c 400 out.ndjson
          echo
          echo "The [usage] line for this call is the product's per-resume ceiling."
